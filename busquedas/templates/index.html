{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Búsquedas Examen</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="container">

    <h1>
        Algoritmos de Búsqueda
    </h1>

    <form method="POST">

        {% csrf_token %}

        <label>
            Estado Inicial
        </label>

        <input
            type="text"
            name="inicial"
            value="4,2,3,1"
        >

        <label>
            Estado Objetivo
        </label>

        <input
            type="text"
            name="objetivo"
            value="1,2,3,4"
        >

        <label>
            Selecciona Algoritmo
        </label>

        <select name="algoritmo">

            <option value="bfs">
                BFS
            </option>

            <option value="dfs">
                DFS
            </option>

            <option value="ucs">
                UCS
            </option>

            <option value="todos">
                Mostrar Todos
            </option>

        </select>

        <button type="submit">

            Resolver

        </button>

    </form>

    {% for nombre, camino in resultados.items %}

    <div class="resultado">

        <h2>
            {{ nombre }}
        </h2>

        <ul>

            {% for paso in camino %}

                <li>
                    {{ paso }}
                </li>

            {% endfor %}

        </ul>

        <p>

            <strong>
                Total de pasos:
            </strong>

            {{ camino|length }}

        </p>

    </div>

    {% endfor %}

</div>

</body>
</html>
